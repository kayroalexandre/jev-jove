      <stop offset="0%" stop-color="#1E1B4B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="accent" x1="34" y1="34" x2="94" y2="94" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>
  </defs>
  <!-- 10%+ transparent margin around 100x100 badge inside 128x128 square canvas -->
  <rect x="14" y="14" width="100" height="100" rx="22" fill="url(#bg)" stroke="#64748B" stroke-opacity="0.45" stroke-width="2" />
  <!-- Calibrated probability arc -->
  <path d="M 38 78 A 28 28 0 1 1 90 78" stroke="url(#accent)" stroke-width="6" stroke-linecap="round" fill="none" />
