  <!-- Central System-One node -->
  <circle cx="64" cy="58" r="8" fill="#F8FAFC" stroke="#38BDF8" stroke-width="3" />
  <!-- Leaf outcome pins (block, review, approve) -->
  <circle cx="46" cy="84" r="5" fill="#F43F5E" />
  <circle cx="64" cy="90" r="5" fill="#F59E0B" />
  <circle cx="82" cy="84" r="5" fill="#34D399" />
